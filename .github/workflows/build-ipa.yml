name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate course content
        run: python3 scripts/validate_content.py

  build:
    needs: check-content
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SansFaute.xcodeproj \
            -scheme SansFaute \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/SansFaute.app

      - name: Show compiler errors
        if: failure()
        run: grep -n "error:" build.log | head -50 || true

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SansFaute.app Payload/
          zip -qry SansFaute.ipa Payload
          ls -lh SansFaute.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SansFaute-ipa
          path: SansFaute.ipa

      - name: Publish release (latest build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: SansFaute ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          body: |
            Unsigned IPA. Install it with AltStore, SideStore or Sideloadly, which sign it with your Apple ID.
          files: SansFaute.ipa
          make_latest: true
