name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate course content
        run: python3 scripts/validate_content.py

  build:
    needs: check-content
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SansFaute.xcodeproj \
            -scheme SansFaute \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -80 || true
          # The .app folder exists before compiling, so check for the real executable.
          test -f build/Build/Products/Release-iphoneos/SansFaute.app/SansFaute

      - name: Publish compiler errors
        if: failure()
        run: |
          grep -E "error:|note:|BUILD FAILED" build.log | sed "s#$GITHUB_WORKSPACE/##" | head -200 > build-errors.txt || true
          tail -60 build.log >> build-errors.txt
          gh release delete build-errors -y --cleanup-tag || true
          gh release create build-errors build-errors.txt --prerelease --title "Build errors" --notes "Latest failed build"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SansFaute.app Payload/
          zip -qry SansFaute.ipa Payload
          ls -lh SansFaute.ipa
          gh release delete build-errors -y --cleanup-tag || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SansFaute-ipa
          path: SansFaute.ipa

      - name: Publish release (latest build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: SansFaute ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          body: |
            Unsigned IPA. Install it with AltStore, SideStore or Sideloadly, which sign it with your Apple ID.
          files: SansFaute.ipa
          make_latest: true
